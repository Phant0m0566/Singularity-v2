app = "singularity-v2"
primary_region = "ord"

[build]
  dockerfile = "fly-browser/Dockerfile"

[env]
  PORT = "8080"
  ALLOWED_ORIGINS = "https://singularity-v2.themultiverseeyt.workers.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 2

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

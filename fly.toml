# fly.toml app configuration file generated for singularity-v2 on 2026-11-14T01:02:13Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'singularity-v2'
primary_region = 'iad'

[build]
  dockerfile = 'fly-browser/Dockerfile'

[env]
  ALLOWED_ORIGINS = 'https://singularity-v2.themultiverseeyt.workers.dev'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 8

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
